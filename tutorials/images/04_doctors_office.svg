<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 310" width="640" style="max-width:100%;height:auto" role="img" aria-label="A patient stands on a scale beside a height rod; next to them are two doorways of different heights, and the doctor's chart records only the BMI">
<rect x="0" y="0" width="640" height="310" rx="10" fill="#E8EDF3"/>
<line x1="20" y1="272" x2="390" y2="272" stroke="#8592a6" stroke-width="2"/>
<!-- height rod -->
<g stroke="#17243D" stroke-width="2" stroke-linecap="round">
  <line x1="56" y1="40" x2="56" y2="258"/>
  <line x1="56" y1="78" x2="118" y2="78"/>
</g>
<g stroke="#8592a6" stroke-width="1.5">
  <line x1="56" y1="60" x2="64" y2="60"/><line x1="56" y1="100" x2="64" y2="100"/><line x1="56" y1="120" x2="64" y2="120"/><line x1="56" y1="140" x2="64" y2="140"/><line x1="56" y1="160" x2="64" y2="160"/><line x1="56" y1="180" x2="64" y2="180"/><line x1="56" y1="200" x2="64" y2="200"/><line x1="56" y1="220" x2="64" y2="220"/><line x1="56" y1="240" x2="64" y2="240"/>
</g>
<text x="36" y="160" text-anchor="middle" font-family="KaTeX_Math, 'Times New Roman', serif" font-style="italic" font-size="22" fill="#17243D">h</text>
<!-- scale -->
<rect x="66" y="252" width="104" height="16" rx="4" fill="#ffffff" stroke="#17243D" stroke-width="2"/>
<!-- patient -->
<g stroke="#17243D" stroke-width="2" stroke-linejoin="round" stroke-linecap="round">
  <rect x="100" y="188" width="16" height="64" rx="6" fill="#17243D"/>
  <rect x="122" y="188" width="16" height="64" rx="6" fill="#17243D"/>
  <rect x="84" y="138" width="16" height="56" rx="8" fill="#418FC5" transform="rotate(8 92 140)"/>
  <rect x="138" y="138" width="16" height="56" rx="8" fill="#418FC5" transform="rotate(-8 146 140)"/>
  <rect x="96" y="120" width="46" height="76" rx="12" fill="#418FC5"/>
  <circle cx="119" cy="99" r="20" fill="#ffffff"/>
</g>
<text x="182" y="266" font-family="KaTeX_Math, 'Times New Roman', serif" font-style="italic" font-size="22" fill="#17243D">w</text>
<!-- doorways -->
<g fill="none" stroke="#17243D" stroke-width="3" stroke-linejoin="round">
  <path d="M 226 272 L 226 64 L 284 64 L 284 272"/>
  <path d="M 312 272 L 312 108 L 370 108 L 370 272"/>
</g>
<text x="298" y="294" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="14" fill="#17243D">doorways</text>
<!-- chart -->
<rect x="420" y="36" width="190" height="244" rx="8" fill="#ffffff" stroke="#17243D" stroke-width="2"/>
<rect x="485" y="26" width="60" height="20" rx="5" fill="#8592a6" stroke="#17243D" stroke-width="2"/>
<text x="515" y="78" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="15" font-weight="600" fill="#17243D">chart</text>
<g font-family="Inter, system-ui, sans-serif" font-size="14" fill="#8592a6">
  <text x="438" y="118">height</text>
  <line x1="500" y1="118" x2="592" y2="118" stroke="#8592a6" stroke-width="1.5"/>
  <text x="438" y="156">weight</text>
  <line x1="500" y1="156" x2="592" y2="156" stroke="#8592a6" stroke-width="1.5"/>
</g>
<rect x="430" y="176" width="170" height="40" rx="6" fill="#E0A348" fill-opacity="0.35"/>
<text x="438" y="202" font-family="Inter, system-ui, sans-serif" font-size="14" fill="#17243D">BMI</text>
<text x="500" y="203" font-family="Inter, system-ui, sans-serif" font-size="18" font-weight="600" fill="#17243D">23.4</text>
<line x1="500" y1="208" x2="592" y2="208" stroke="#17243D" stroke-width="1.5"/>
<text x="515" y="252" text-anchor="middle" font-family="KaTeX_Math, 'Times New Roman', serif" font-style="italic" font-size="20" fill="#17243D">w<tspan font-family="KaTeX_Main, 'Times New Roman', serif" font-style="normal"> / </tspan>h<tspan font-family="KaTeX_Main, 'Times New Roman', serif" font-style="normal" font-size="13" dy="-8">2</tspan></text>
</svg>
