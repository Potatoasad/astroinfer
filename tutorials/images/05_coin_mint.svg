<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 290" width="640" style="max-width:100%;height:auto" role="img" aria-label="A mint stamps coins onto a conveyor belt; each coin has its own slightly different chance of heads p, and the values of p follow a bell-shaped population distribution">
<defs><marker id="n05-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#17243D"/></marker></defs>
<rect x="0" y="0" width="640" height="290" rx="10" fill="#E8EDF3"/>
<!-- press -->
<g stroke="#17243D" stroke-width="2" stroke-linejoin="round">
  <rect x="36" y="34" width="132" height="64" rx="8" fill="#418FC5"/>
  <rect x="44" y="98" width="16" height="132" fill="#ffffff"/>
  <rect x="144" y="98" width="16" height="132" fill="#ffffff"/>
  <rect x="94" y="98" width="16" height="58" fill="#8592a6"/>
  <rect x="74" y="156" width="56" height="18" rx="3" fill="#17243D"/>
</g>
<text x="102" y="64" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="15" font-weight="600" fill="#ffffff">mint</text>
<text x="102" y="88" text-anchor="middle" font-family="KaTeX_Main, 'Times New Roman', serif" font-size="18" fill="#ffffff">Λ</text>
<ellipse cx="102" cy="206" rx="22" ry="7" fill="#E0A348" stroke="#17243D" stroke-width="2"/>
<!-- conveyor -->
<rect x="30" y="214" width="440" height="22" rx="11" fill="#ffffff" stroke="#17243D" stroke-width="2"/>
<g fill="#8592a6"><circle cx="48" cy="225" r="5"/><circle cx="130" cy="225" r="5"/><circle cx="212" cy="225" r="5"/><circle cx="294" cy="225" r="5"/><circle cx="376" cy="225" r="5"/><circle cx="452" cy="225" r="5"/></g>
<line x1="210" y1="258" x2="440" y2="258" stroke="#8592a6" stroke-width="2" marker-end="url(#n05-arrow)"/>
<!-- coins -->
<g stroke="#17243D" stroke-width="2" fill="#E0A348">
  <circle cx="214" cy="188" r="24"/><circle cx="290" cy="188" r="24"/><circle cx="366" cy="188" r="24"/><circle cx="442" cy="188" r="24"/>
</g>
<g font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="600" text-anchor="middle" fill="#17243D">
  <text x="214" y="193">0.48</text><text x="290" y="193">0.55</text><text x="366" y="193">0.44</text><text x="442" y="193">0.51</text>
</g>
<text x="328" y="140" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="14" fill="#17243D">each coin has its own <tspan font-family="KaTeX_Math, 'Times New Roman', serif" font-style="italic" font-size="19">p</tspan></text>
<!-- population -->
<rect x="490" y="34" width="130" height="202" rx="8" fill="#ffffff"/>
<text x="555" y="62" text-anchor="middle" font-family="KaTeX_Math, 'Times New Roman', serif" font-style="italic" font-size="18" fill="#17243D">π<tspan font-family="KaTeX_Main, 'Times New Roman', serif" font-style="normal">(</tspan>p<tspan font-family="KaTeX_Main, 'Times New Roman', serif" font-style="normal"> | Λ)</tspan></text>
<path d="M 504 196 C 530 196 536 92 555 92 C 574 92 580 196 606 196" fill="#418FC5" fill-opacity="0.18" stroke="#418FC5" stroke-width="2.5"/>
<line x1="500" y1="196" x2="610" y2="196" stroke="#17243D" stroke-width="1.5"/>
<g stroke="#E0A348" stroke-width="3" stroke-linecap="round">
  <line x1="552" y1="190" x2="552" y2="202"/><line x1="566" y1="190" x2="566" y2="202"/><line x1="546" y1="190" x2="546" y2="202"/><line x1="558" y1="190" x2="558" y2="202"/>
</g>
<text x="555" y="222" text-anchor="middle" font-family="KaTeX_Math, 'Times New Roman', serif" font-style="italic" font-size="18" fill="#17243D">p</text>
</svg>
