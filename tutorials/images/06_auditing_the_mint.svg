<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 300" width="640" style="max-width:100%;height:auto" role="img" aria-label="A regulator with a clipboard audits the mint by flipping many coins bought from it, each coin with its own tally of heads and tails">
<rect x="0" y="0" width="640" height="300" rx="10" fill="#E8EDF3"/>
<line x1="20" y1="262" x2="190" y2="262" stroke="#8592a6" stroke-width="2"/>
<!-- regulator -->
<g stroke="#17243D" stroke-width="2" stroke-linejoin="round" stroke-linecap="round">
  <rect x="64" y="196" width="16" height="66" rx="6" fill="#17243D"/>
  <rect x="86" y="196" width="16" height="66" rx="6" fill="#17243D"/>
  <rect x="48" y="132" width="16" height="60" rx="8" fill="#418FC5" transform="rotate(10 56 134)"/>
  <rect x="58" y="116" width="50" height="86" rx="12" fill="#418FC5"/>
  <circle cx="83" cy="93" r="20" fill="#ffffff"/>
  <path d="M 62 84 Q 64 66 83 66 Q 102 66 104 84 Z" fill="#17243D"/>
  <rect x="98" y="128" width="16" height="58" rx="8" fill="#418FC5" transform="rotate(-50 106 132)"/>
  <rect x="112" y="136" width="56" height="72" rx="5" fill="#ffffff"/>
  <rect x="128" y="130" width="24" height="10" rx="3" fill="#8592a6"/>
</g>
<text x="140" y="176" text-anchor="middle" font-family="KaTeX_Main, 'Times New Roman', serif" font-size="22" fill="#17243D">Λ ?</text>
<line x1="122" y1="192" x2="158" y2="192" stroke="#8592a6" stroke-width="1.5"/>
<text x="92" y="286" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="14" fill="#17243D">regulator</text>
<!-- coins and tallies -->
<g font-family="Inter, system-ui, sans-serif">
  <g transform="translate(214 30)">
    <rect width="190" height="60" rx="8" fill="#ffffff" stroke="#17243D" stroke-width="2"/>
    <circle cx="32" cy="30" r="18" fill="#E0A348" stroke="#17243D" stroke-width="2"/>
    <text x="32" y="35" text-anchor="middle" font-size="12" font-weight="600" fill="#17243D">1</text>
    <text x="62" y="36" font-size="15" font-weight="600" letter-spacing="3" fill="#17243D">HTHHTHT…</text>
  </g>
  <g transform="translate(420 30)">
    <rect width="190" height="60" rx="8" fill="#ffffff" stroke="#17243D" stroke-width="2"/>
    <circle cx="32" cy="30" r="18" fill="#E0A348" stroke="#17243D" stroke-width="2"/>
    <text x="32" y="35" text-anchor="middle" font-size="12" font-weight="600" fill="#17243D">2</text>
    <text x="62" y="36" font-size="15" font-weight="600" letter-spacing="3" fill="#17243D">TTHTHHT…</text>
  </g>
  <g transform="translate(214 102)">
    <rect width="190" height="60" rx="8" fill="#ffffff" stroke="#17243D" stroke-width="2"/>
    <circle cx="32" cy="30" r="18" fill="#E0A348" stroke="#17243D" stroke-width="2"/>
    <text x="32" y="35" text-anchor="middle" font-size="12" font-weight="600" fill="#17243D">3</text>
    <text x="62" y="36" font-size="15" font-weight="600" letter-spacing="3" fill="#17243D">HHHTHTH…</text>
  </g>
  <g transform="translate(420 102)">
    <rect width="190" height="60" rx="8" fill="#ffffff" stroke="#17243D" stroke-width="2"/>
    <circle cx="32" cy="30" r="18" fill="#E0A348" stroke="#17243D" stroke-width="2"/>
    <text x="32" y="35" text-anchor="middle" font-size="12" font-weight="600" fill="#17243D">4</text>
    <text x="62" y="36" font-size="15" font-weight="600" letter-spacing="3" fill="#17243D">THTTHTH…</text>
  </g>
  <g transform="translate(214 174)">
    <rect width="190" height="60" rx="8" fill="#ffffff" stroke="#17243D" stroke-width="2"/>
    <circle cx="32" cy="30" r="18" fill="#E0A348" stroke="#17243D" stroke-width="2"/>
    <text x="32" y="35" text-anchor="middle" font-size="12" font-weight="600" fill="#17243D">5</text>
    <text x="62" y="36" font-size="15" font-weight="600" letter-spacing="3" fill="#17243D">HTHHHTT…</text>
  </g>
  <g transform="translate(420 174)">
    <rect width="190" height="60" rx="8" fill="#ffffff" stroke="#8592a6" stroke-width="2" stroke-dasharray="6 5"/>
    <text x="95" y="36" text-anchor="middle" font-size="15" fill="#8592a6">… up to coin 40</text>
  </g>
  <text x="412" y="270" text-anchor="middle" font-size="14" fill="#17243D">30 flips per coin, each coin with its own unknown <tspan font-family="KaTeX_Math, 'Times New Roman', serif" font-style="italic" font-size="19">p<tspan font-size="13" dy="4">i</tspan></tspan></text>
</g>
</svg>
