<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 280" width="640" style="max-width:100%;height:auto" role="img" aria-label="A hand flips a coin; the coins land heads or tails and the outcomes are tallied">
<rect x="0" y="0" width="640" height="280" rx="10" fill="#E8EDF3"/>
<!-- hand -->
<g stroke="#17243D" stroke-width="2" stroke-linejoin="round" stroke-linecap="round">
  <path d="M 60 280 L 60 222 L 104 222 L 104 280" fill="#418FC5"/>
  <rect x="54" y="214" width="56" height="14" rx="4" fill="#418FC5"/>
  <rect x="56" y="160" width="74" height="56" rx="16" fill="#ffffff"/>
  <path d="M 108 172 L 108 214 M 120 174 L 120 212" fill="none" stroke="#8592a6"/>
  <rect x="84" y="150" width="58" height="18" rx="9" fill="#ffffff" transform="rotate(-24 90 159)"/>
</g>
<!-- coin in the air -->
<path d="M 146 124 Q 168 70 198 58" fill="none" stroke="#8592a6" stroke-width="2" stroke-dasharray="5 5"/>
<g transform="translate(220 52)">
  <ellipse cx="0" cy="0" rx="22" ry="8" fill="#E0A348" stroke="#17243D" stroke-width="2"/>
  <path d="M -30 -16 Q -14 -26 2 -22" fill="none" stroke="#8592a6" stroke-width="2"/>
  <path d="M 28 12 Q 16 22 -2 20" fill="none" stroke="#8592a6" stroke-width="2"/>
</g>
<text x="214" y="104" font-family="KaTeX_Math, 'Times New Roman', serif" font-style="italic" font-size="20" fill="#17243D">p</text>
<text x="226" y="104" font-family="Inter, system-ui, sans-serif" font-size="14" fill="#17243D"> = chance of heads</text>
<!-- coins on the table -->
<line x1="190" y1="232" x2="420" y2="232" stroke="#8592a6" stroke-width="2"/>
<g font-family="Inter, system-ui, sans-serif" font-size="18" font-weight="600" text-anchor="middle" fill="#17243D">
  <circle cx="222" cy="204" r="24" fill="#E0A348" stroke="#17243D" stroke-width="2"/><text x="222" y="210">H</text>
  <circle cx="280" cy="204" r="24" fill="#ffffff" stroke="#17243D" stroke-width="2"/><text x="280" y="210">T</text>
  <circle cx="338" cy="204" r="24" fill="#E0A348" stroke="#17243D" stroke-width="2"/><text x="338" y="210">H</text>
  <circle cx="396" cy="204" r="24" fill="#E0A348" stroke="#17243D" stroke-width="2"/><text x="396" y="210">H</text>
</g>
<!-- tally card -->
<rect x="448" y="40" width="160" height="200" rx="8" fill="#ffffff" stroke="#17243D" stroke-width="2"/>
<text x="528" y="68" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="14" fill="#17243D">outcomes</text>
<line x1="462" y1="80" x2="594" y2="80" stroke="#8592a6" stroke-width="2"/>
<g font-family="Inter, system-ui, sans-serif" font-size="17" font-weight="600" fill="#17243D">
  <text x="468" y="108" letter-spacing="6">H T H H T</text>
  <text x="468" y="136" letter-spacing="6">H H T H H</text>
  <text x="468" y="164" letter-spacing="6">T H H T H</text>
  <text x="468" y="192" letter-spacing="6">H H T H</text><text x="568" y="192" fill="#8592a6">...</text>
</g>
<line x1="462" y1="206" x2="594" y2="206" stroke="#8592a6" stroke-width="2"/>
<text x="528" y="228" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="14" fill="#418FC5">13 heads in 19</text>
</svg>
