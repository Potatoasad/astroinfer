# Workspace root: one environment and one lock for every package in packages/,
# plus the tutorials and notebooks. Not a package itself.
[project]
name = "astroinfer-workspace"
version = "0"
requires-python = ">=3.12"
dependencies = []

[dependency-groups]
dev = [
    "astroinfer[marimo]",
    "astroinfer-tgmm[plot]",
    "astroinfer-gw",
    "marimo>=0.25.2",
    "matplotlib",
    "scipy",
    "pytest>=8",
    "ruff",
]
# For notebooks/gw/06_ringdown_real_noise.py and 07_gw150914_ringdown.py, which fetch open
# LIGO-Virgo data and condition it with ringdown, for example
# uv run --group ringdown marimo edit notebooks/gw/07_gw150914_ringdown.py
ringdown = [
    "gwpy",
    "ringdown",
]

[tool.uv]
package = false

[tool.uv.workspace]
members = ["packages/*"]

[tool.uv.sources]
# Packages in this repository (installed editable).
astroinfer = { workspace = true }
astroinfer-tgmm = { workspace = true }
astroinfer-gw = { workspace = true }
# Dependencies installed from git. These sources apply only inside this workspace;
# see docs/installation.md for what that means for users.
truncatedgaussianmixtures = { git = "https://github.com/Potatoasad/truncatedgaussianmixtures", rev = "jax-backend" }
plot-helper = { git = "https://github.com/Potatoasad/plot_helper" }
# ringdown's latest release pins numpy 1.26 and numpyro 0.19; its main branch works with ours.
ringdown = { git = "https://github.com/maxisi/ringdown", rev = "757bcc7ee2d31c589dc12c16b01e025a403de215" }

[tool.pytest.ini_options]
testpaths = [
    "packages/astroinfer/tests",
    "packages/astroinfer-tgmm/tests",
    "packages/astroinfer-gw/tests",
]
addopts = ["--import-mode=importlib"]
markers = ["julia: needs Julia and fits TGMMs (slow on first run)"]

[tool.marimo.runtime]
output_max_bytes = 10_000_000
