[project]
name = "astroinfer-gwmockcat"
version = "0.1.0"
description = "GWMockCat-style mock gravitational-wave catalogs for astroinfer"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "astroinfer",
    "astropy",
    "gravpop",
    "numpyro",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
