[project]
name = "astroinfer-gw"
version = "0.1.0"
description = "Gravitational-wave models for astroinfer, including GWMockCat-style mock catalogs"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "astroinfer",
    "astropy",
    "gravpop @ git+https://git.ligo.org/asad.hussain/gravpop@simplify-composite",
    "numpyro",
]

# gravpop is not on PyPI, so it is a direct git reference; hatchling rejects these unless allowed.
[tool.hatch.metadata]
allow-direct-references = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
