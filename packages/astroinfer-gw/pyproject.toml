[project]
name = "astroinfer-gw"
version = "0.1.0"
description = "Gravitational-wave models for astroinfer, including GWMockCat-style mock catalogs"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "astroinfer",
    "astropy",
    "gravpop",
    "numpyro",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
